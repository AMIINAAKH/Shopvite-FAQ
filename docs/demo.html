<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopVite — Assistant Support Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f9f9;
      --white: #ffffff;
      --border: #e4e4e7;
      --text: #18181b;
      --muted: #71717a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --user-bg: #2563eb;
      --user-text: #ffffff;
      --bot-bg: #ffffff;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    /* ── WRAPPER ── */
    .chat-wrapper {
      width: 100%;
      max-width: 680px;
      height: min(700px, calc(100vh - 2rem));
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .chat-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .header-info strong {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .header-info span {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-left: auto;
      flex-shrink: 0;
    }

    /* ── MESSAGES ── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Message row */
    .msg-row {
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .msg-avatar.bot { background: #eff6ff; color: var(--accent); }
    .msg-avatar.user { background: var(--user-bg); color: white; }

    .bubble {
      max-width: 82%;
      padding: 0.7rem 0.95rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      line-height: 1.6;
    }

    .bubble.bot {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    .bubble.user {
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }

    .bubble strong { font-weight: 600; }
    .bubble br { display: block; content: ''; margin: 0.15rem 0; }

    /* Source tag */
    .source-line {
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .src-tag {
      background: #f4f4f5;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.68rem;
      color: var(--muted);
    }

    /* Typing indicator */
    .typing-bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      padding: 0.75rem 1rem;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* Welcome message */
    .welcome {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
    }

    .welcome .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .welcome h2 { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 0.4rem; }
    .welcome p { font-size: 0.82rem; }

    /* Suggestions */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
      margin-top: 1rem;
    }

    .sug {
      font-size: 0.78rem;
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--white);
      cursor: pointer;
      color: var(--text);
      transition: all 0.15s;
      white-space: nowrap;
    }

    .sug:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* ── INPUT AREA ── */
    .chat-input-area {
      padding: 0.875rem 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.6rem;
      align-items: center;
      flex-shrink: 0;
    }

    .chat-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 0.6rem 1rem;
      font-family: inherit;
      font-size: 0.875rem;
      color: var(--text);
      background: var(--bg);
      outline: none;
      resize: none;
      transition: border-color 0.15s;
    }

    .chat-input:focus { border-color: var(--accent); background: var(--white); }
    .chat-input::placeholder { color: var(--muted); }

    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:active { transform: scale(0.93); }
    .send-btn:disabled { background: var(--border); cursor: not-allowed; }

    .send-btn svg { width: 16px; height: 16px; fill: white; }

    .input-footer {
      text-align: center;
      font-size: 0.68rem;
      color: var(--muted);
      padding: 0 1.25rem 0.6rem;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div class="chat-wrapper">

  <!-- Header -->
  <div class="chat-header">
    <div class="avatar">🛍️</div>
    <div class="header-info">
      <strong>Assistant ShopVite</strong>
      <span>Support client · Électronique</span>
    </div>
    <div class="online-dot" title="En ligne"></div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="messages">
    <div class="welcome" id="welcomeBlock">
      <div class="icon">👋</div>
      <h2>Bonjour ! Comment puis-je vous aider ?</h2>
      <p>Posez-moi vos questions sur nos produits, livraisons, retours et garanties.</p>
      <div class="suggestions">
        <button class="sug" onclick="sendSuggestion(this)">Politique de retour</button>
        <button class="sug" onclick="sendSuggestion(this)">Délais de livraison</button>
        <button class="sug" onclick="sendSuggestion(this)">Garantie produit</button>
        <button class="sug" onclick="sendSuggestion(this)">Moyens de paiement</button>
        <button class="sug" onclick="sendSuggestion(this)">Comparer des smartphones</button>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-area">
    <input
      id="input"
      class="chat-input"
      type="text"
      placeholder="Posez votre question…"
      autocomplete="off"
      onkeydown="if(event.key==='Enter') send()"
    />
    <button class="send-btn" id="sendBtn" onclick="send()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="input-footer">Réponses basées exclusivement sur la documentation ShopVite</div>

</div>

<script>
  const MISTRAL_API_KEY = 'api_key_mistral'; // Ajouter votre API key Mistral
  const MISTRAL_URL = 'https://api.mistral.ai/v1/chat/completions';
  const LOCAL_API = 'http://localhost:8000';

  const SYSTEM_PROMPT = `Tu es l'assistant virtuel de ShopVite, une boutique en ligne spécialisée en électronique.
Tu réponds aux questions des clients de manière professionnelle, concise et toujours en français.

RÈGLES ABSOLUES :
1. Réponds UNIQUEMENT à partir du contexte fourni entre les balises <contexte> et </contexte>.
2. Ne jamais inventer de prix, délais, politiques ou caractéristiques produits.
3. Si la question est hors-contexte, réponds : "Je n'ai pas l'information nécessaire pour répondre à cette question dans ma base de connaissances. Je vous invite à contacter notre support : support@shopvite.fr ou au 0800 123 456."
4. Cite toujours la source à la fin de ta réponse entre parenthèses, ex : (Source : guide_livraison.md)
5. Sois concis : 2 à 5 phrases maximum, sauf si une liste est nécessaire.
6. Ton : professionnel, chaleureux.

EXEMPLES :
Q: "Combien de temps ai-je pour retourner un produit ?"
R: "Vous disposez de 30 jours calendaires à compter de la réception pour retourner tout produit. Pour un produit défectueux, ce délai est étendu à 60 jours. (Source : politique_retours.md)"

Q: "Quelle est la météo à Paris ?"
R: "Je n'ai pas l'information nécessaire pour répondre à cette question dans ma base de connaissances. Je vous invite à contacter notre support : support@shopvite.fr ou au 0800 123 456."`;

  // ── Corpus local (fallback si API locale indisponible) ──────────────────────
  const CORPUS = {
    "retour|rembours|renvoi|renvoyer": {
      text: `[Source : politique_retours.md]
Politique de Retour ShopVite :
- Délai : 30 jours calendaires à compter de la réception (60 jours si défectueux)
- Conditions : emballage d'origine, non activé, sans dommages
- Non retournables : logiciels activés, écouteurs intra-auriculaires (hygiène), produits personnalisés
- Procédure : espace client → Mes commandes → Retourner un article → imprimer étiquette prépayée
- Remboursement : 5 à 10 jours ouvrés (CB), 3 à 5 jours (PayPal), immédiat (bon d'achat)
- Frais retour : gratuit si défectueux, 4,99 € sinon`,
      sources: ["politique_retours.md"]
    },
    "livraison|livrer|expédition|colis|délai|transport|chronopost|colissimo|relais": {
      text: `[Source : guide_livraison.md]
Guide Livraison ShopVite :
- Standard (Colissimo) : 3 à 5 jours ouvrés — 4,99 €
- Express (Chronopost) : 24h à 48h — 9,99 €
- Point relais (Mondial Relay) : 4 à 6 jours ouvrés — 2,99 €
- Gratuit dès 50 € d'achat (standard 3-5 jours)
- Zones : France métropolitaine, DOM-TOM (7-14j), Europe (5-10j)
- Suivi : email avec numéro de tracking dès l'expédition`,
      sources: ["guide_livraison.md"]
    },
    "garantie|sav|défaut|défectueux|répar|cassé|pann": {
      text: `[Source : garantie_sav.md]
Garantie ShopVite :
- Garantie légale de conformité : 2 ans (art. L217-4)
- Garantie constructeur : smartphones 1 an, TV 2 ans, PC portables 1-2 ans, périphériques 1 an
- Procédure : espace client → déclarer un défaut → réparation (10-21j) ou remplacement (3-5j)
- Extension ShopVite+ disponible à l'achat (jusqu'à +2 ans)
- Exclusions : chutes, immersion, usure normale, réparation non autorisée`,
      sources: ["garantie_sav.md"]
    },
    "paiement|payer|carte|paypal|virement|alma|3x|4x|mensuel|apple pay|google pay": {
      text: `[Source : cgv_paiement.md]
Paiements acceptés :
- Carte bancaire : Visa, Mastercard, Amex (3D Secure)
- PayPal, Apple Pay, Google Pay
- Virement bancaire (3-5 jours ouvrés)
- Carte cadeau ShopVite
- Paiement 3x ou 4x sans frais dès 150 € (Alma ou PayPal Pay Later)
- Paiement 10x/12x avec intérêts dès 500 € (Cofidis, TAEG 4,99%)`,
      sources: ["cgv_paiement.md"]
    },
    "techphone|pro 15|lite 15|budgetphone|x3|smartphone|téléphone|portable|comparatif|comparer": {
      text: `[Source : catalogue_produits.json]
Smartphones disponibles :
TechPhone Pro 15 — 899,99 € : Écran OLED 6,7" 120Hz, triple caméra 108MP, 5000mAh charge 65W, 12Go RAM, 5G, IP68. Note : 4,6/5
TechPhone Lite 15 — 599,99 € : AMOLED 6,1" 90Hz, 64MP+8MP, 4000mAh charge 33W, 8Go RAM, 5G, IP67. Note : 4,3/5
BudgetPhone X3 — 249,99 € : LCD 6,5" 60Hz, 50MP, 5000mAh, 4Go RAM, pas de 5G, IPX4. Note : 4,0/5
Comparatif Pro vs Budget : +650€ justifiés par écran OLED, charge ultra-rapide (65W vs 18W) et photo nuit supérieure.`,
      sources: ["catalogue_produits.json"]
    },
    "ordinateur|laptop|pc|ultrabook|gaming|gamer|rtx": {
      text: `[Source : catalogue_produits.json]
Ordinateurs portables :
UltraBook Pro 14 — 1299,99 € : Core i7-13700H, 16Go DDR5, SSD 512Go, écran 14" IPS 2560x1600, 1,4kg, autonomie 12h. Note : 4,7/5
GamingBook RTX 16 — 1799,99 € : Ryzen 7 7745HX, 32Go DDR5, SSD 1To, RTX 4070 8Go, écran 16" 144Hz, 2,8kg. Note : 4,5/5 (stock limité)`,
      sources: ["catalogue_produits.json"]
    },
    "fidélité|points|rewards|silver|gold|programme": {
      text: `[Source : cgv_paiement.md]
Programme ShopVite Rewards :
- 1 point = 1 € dépensé — 100 points = 1 € de réduction
- Statut Silver dès 500 points : livraison offerte sur toutes les commandes
- Statut Gold dès 2000 points : accès prioritaire aux ventes flash + 5% de réduction permanente`,
      sources: ["cgv_paiement.md"]
    },
    "télévision|tv|visionmax|qled|oled|écran|55": {
      text: `[Source : catalogue_produits.json]
Télévisions :
VisionMax 55 QLED — 699,99 € : 55 pouces, 4K UHD, QLED, 100Hz, HDR10+, Dolby Vision, Tizen OS, HDMI 2.1 x4, son 40W Dolby Atmos. Note : 4,4/5`,
      sources: ["catalogue_produits.json"]
    },
    "contact|support|service client|téléphone|email|horaire": {
      text: `[Source : cgv_paiement.md]
Contact Service Client ShopVite :
- Chat en ligne : lun-ven 9h-18h
- Email : support@shopvite.fr (réponse sous 24h ouvrées)
- Téléphone : 0800 123 456 (gratuit, lun-ven 9h-17h)
- Réseaux sociaux : @ShopVite sur Twitter/X, Instagram, Facebook`,
      sources: ["cgv_paiement.md"]
    }
  };

  function getLocalContext(question) {
    const q = question.toLowerCase();
    for (const [pattern, data] of Object.entries(CORPUS)) {
      if (new RegExp(pattern, 'i').test(q)) return data;
    }
    return null;
  }

  // ── DOM helpers ─────────────────────────────────────────────────────────────
  const messagesEl = document.getElementById('messages');

  function scrollBottom() {
    setTimeout(() => messagesEl.scrollTop = messagesEl.scrollHeight, 50);
  }

  function removeWelcome() {
    const w = document.getElementById('welcomeBlock');
    if (w) w.remove();
  }

  function addUserBubble(text) {
    removeWelcome();
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `
      <div class="msg-avatar user">Vous</div>
      <div class="bubble user">${escHtml(text)}</div>
    `;
    messagesEl.appendChild(row);
    scrollBottom();
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row';
    row.id = 'typing';
    row.innerHTML = `
      <div class="msg-avatar bot">🤖</div>
      <div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    `;
    messagesEl.appendChild(row);
    scrollBottom();
    return row;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function renderMd(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/^[-•]\s(.+)/gm, '• $1')
      .replace(/\n/g, '<br>');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function addBotBubble(answer, sources) {
    removeTyping();
    const row = document.createElement('div');
    row.className = 'msg-row';

    const srcHtml = sources && sources.length
      ? `<div class="source-line">📎 ${sources.map(s => `<span class="src-tag">${s}</span>`).join(' ')}</div>`
      : '';

    row.innerHTML = `
      <div class="msg-avatar bot">🤖</div>
      <div class="bubble bot">
        <div>${renderMd(answer)}</div>
        ${srcHtml}
      </div>
    `;
    messagesEl.appendChild(row);
    scrollBottom();
  }

  // ── LLM call ────────────────────────────────────────────────────────────────
  async function callMistral(question, contextText) {
    const userContent = `<contexte>\n${contextText}\n</contexte>\n\nQuestion du client : ${question}`;
    const resp = await fetch(MISTRAL_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${MISTRAL_API_KEY}`
      },
      body: JSON.stringify({
        model: 'mistral-small-latest',
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          { role: 'user', content: userContent }
        ],
        max_tokens: 500,
        temperature: 0.1
      })
    });
    if (!resp.ok) throw new Error(`Mistral ${resp.status}`);
    const data = await resp.json();
    return data.choices[0].message.content.trim();
  }

  // ── Main send logic ──────────────────────────────────────────────────────────
  async function send() {
    const input = document.getElementById('input');
    const btn = document.getElementById('sendBtn');
    const question = input.value.trim();
    if (!question) return;

    input.value = '';
    btn.disabled = true;

    addUserBubble(question);
    const typingRow = addTyping();

    try {
      let answer, sources;

      // 1. Try local API /retrieve → Mistral browser call
      try {
        const r = await fetch(`${LOCAL_API}/retrieve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
          signal: AbortSignal.timeout(2000)
        });
        if (r.ok) {
          const data = await r.json();
          sources = data.sources;
          const ctxText = data.chunks.map(c => `[Source : ${c.source}]\n${c.text}`).join('\n\n---\n\n');
          answer = await callMistral(question, ctxText);
        } else throw new Error('api error');
      } catch {
        // 2. Fallback: corpus local → Mistral browser call
        const local = getLocalContext(question);
        if (local) {
          sources = local.sources;
          answer = await callMistral(question, local.text);
        } else {
          // 3. Out-of-scope
          sources = [];
          answer = await callMistral(question, 'Aucun document pertinent trouvé pour cette question.');
        }
      }

      addBotBubble(answer, sources);
    } catch (err) {
      removeTyping();
      addBotBubble(`Désolé, une erreur est survenue : ${err.message}. Veuillez réessayer ou contacter support@shopvite.fr`, []);
    }

    btn.disabled = false;
    input.focus();
  }

  function sendSuggestion(btn) {
    document.getElementById('input').value = btn.textContent;
    send();
  }
</script>

</body>
</html>
